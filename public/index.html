<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAIL Branding Budget Tracker · Bharat Steel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2B66; --blue:#01578C; --ink:#1E1D1D; --muted:#5b6475; --line:#e3e7ee; --bg:#F4F6F8; --card:#fff;
  --hr:#01578C; --str:#C7701E; --ok:#1d7a46; --okbg:#e5f4ea; --warn:#9a6200; --warnbg:#fff4dc; --bad:#b3261e; --badbg:#fde8e6; --info:#0A2B66; --infobg:#e7eefb;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.75}
header .ctrls{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header label{font-size:12px;opacity:.85}
header select,header input{background:#163a7a;color:#fff;border:1px solid #2c4f91;border-radius:6px;padding:6px 8px;font:inherit}
nav{display:flex;gap:4px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:13px 14px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--navy);border-bottom-color:var(--navy)}
main{padding:20px 22px;max-width:1320px;margin:0 auto}
.banner{padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.bad{background:var(--badbg);color:var(--bad)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:900px){.g2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:8px;padding:10px 12px}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.meter{height:8px;background:#e6e9ef;border-radius:5px;overflow:hidden;margin-top:6px}
.meter>i{display:block;height:100%;border-radius:5px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;background:#fafbfc}
td.n,th.n{text-align:right}
tr.tot td{font-weight:700;background:#fafbfc}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-ok{background:var(--okbg);color:var(--ok)} .c-warn{background:var(--warnbg);color:var(--warn)} .c-bad{background:var(--badbg);color:var(--bad)} .c-info{background:var(--infobg);color:var(--info)} .c-mute{background:#eef0f3;color:var(--muted)}
.tw{overflow-x:auto}
button.btn{background:var(--navy);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
button.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.btn.sm{padding:5px 10px;font-size:12.5px}
button.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}
input,select,textarea{font:inherit;color:var(--ink)}
.f input,.f select,.f textarea,td input,td select{border:1px solid #cdd3dd;border-radius:6px;padding:6px 8px;background:#fff;width:100%}
td input.t{max-width:120px;text-align:right}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:800px){.form{grid-template-columns:1fr}}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.f.w2{grid-column:span 2} .f.w3{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:12.5px;margin-top:8px;white-space:pre-line}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;z-index:20}
.modal{background:#fff;border-radius:12px;max-width:860px;width:100%;padding:20px}
.modal h2{margin:0 0 14px;font-size:17px}
.rules li{margin-bottom:6px;line-height:1.5}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.empty{padding:26px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:30}
.stmt{padding:0;overflow:hidden}.stmt table th,.stmt table td{border:1px solid #d5d9e0}
.stmt tr.yh th{background:#FFF200;color:#000;text-align:center;font-size:14px;text-transform:none;letter-spacing:0;padding:9px}
.stmt tr.yc th{background:#FFF200;color:#000;font-size:12.5px;text-transform:none;letter-spacing:0}
.stmt td.xs{background:#C00000;color:#fff;font-weight:700} .stmt td.rm{color:var(--ok)}
.stmt tr.dim td{color:#9aa1ad} .stmt a{color:var(--navy)}
a.btn.wa{background:#1e8e4e;color:#fff;text-decoration:none;display:inline-block;border-radius:7px;font-weight:600}
.login{min-height:100vh;align-items:center;justify-content:center;background:linear-gradient(160deg,#0A2B66,#01578C);padding:20px}
.lcard{background:#fff;border-radius:12px;padding:28px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.lbrand{font-size:20px;font-weight:700;color:var(--navy)}
.lcard .f input{border:1px solid #cdd3dd;border-radius:6px;padding:9px 10px;width:100%}
.pill-hr{color:var(--hr);font-weight:700} .pill-str{color:var(--str);font-weight:700}
</style>
</head>
<body>
<div id="login" class="login" style="display:none">
  <form id="lForm" class="lcard" autocomplete="on">
    <div class="lbrand">SAIL Branding Budget</div>
    <div class="hint" style="margin-bottom:16px">Bharat Steel (Chennai) Pvt. Ltd.</div>
    <div class="f"><label>Email</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="f" style="margin-top:10px"><label>Password</label><input id="lPw" type="password" autocomplete="current-password" required></div>
    <div id="lErr" class="err"></div>
    <button class="btn" id="lBtn" style="width:100%;margin-top:14px;padding:10px">Sign in</button>
    <div class="hint" style="margin-top:12px">Forgot your password? Ask a tracker admin to reset it.</div>
    <div id="lViewWrap" style="display:none;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);text-align:center"><a href="#" id="lView" style="color:var(--navy);font-weight:600">View the tracker without signing in →</a></div>
  </form>
</div>
<div id="app" style="display:none">
<header>
  <div>
    <h1>SAIL Branding Budget Tracker</h1>
    <div class="sub">Bharat Steel (Chennai) Pvt. Ltd. · HR Coil &amp; Structural lifting</div>
  </div>
  <div class="ctrls">
    <label>Financial year</label><select id="fySel"></select>
    <label>As of</label><input type="date" id="asOf">
    <button id="bell" type="button" title="Notifications" style="position:relative;background:none;border:1px solid #2c4f91;color:#fff;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer">🔔<span class="bn" style="display:none;position:absolute;top:-7px;right:-7px;background:#d93025;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 6px">0</span></button>
    <span id="who" style="font-size:12px;opacity:.85;margin-left:6px"></span>
    <button id="logout" type="button" style="background:none;border:1px solid #2c4f91;color:#fff;border-radius:6px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer">Sign out</button>
  </div>
</header>
<nav id="tabs">
  <button data-t="dash" class="on">Dashboard</button>
  <button data-t="stmt">Quarter statement</button>
  <button data-t="lift">Lifting entry</button>
  <button data-t="act">Branding activities</button>
  <button data-t="terms">Terms &amp; conditions</button>
  <button data-t="set">Settings &amp; rules</button>
</nav>
<main id="main"><div class="empty">Loading…</div></main>
<div id="modalRoot"></div>
</div>

<script>
/* ---------- state ---------- */
const PRODS = [{k:'HR',name:'HR Coil',cls:'pill-hr',color:'var(--hr)'},{k:'STR',name:'Structural',cls:'pill-str',color:'var(--str)'}];
const MON = ['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
const STATUSES = ['Draft','Sent to SAIL','Approved by SAIL','Rejected','Completed'];
const DEFAULT_CATS = ['Gifting - T-shirts','Gifting - Stationery','Gifting - Other','Signage / Hoarding','Shop / Yard branding','Vehicle branding','Print & Brochures','Digital / Social media','Dealer & customer meet','Other'];
const CLAIMS = ['Not claimed','Draft invoice sent','Claim submitted to SAIL','Claim received'];
const DEFAULT_NOTIFY = {budgetWa:[], claimsWa:[], pendingDays:7, claimDays:30, warnDays:7};
const DEFAULT_CFG = {rate:100, giftCapPct:25, lapse:false, releases:{}, categories:DEFAULT_CATS, notify:DEFAULT_NOTIFY};
const S = {me:null, cfg:{...DEFAULT_CFG}, lifting:{}, acts:[], files:[], storage:{ready:false}, tab:'dash', fy:null, asOf:null, loaded:{cfg:false,lift:false,act:false}, readonly:false, actFilter:{prod:'',status:'',q:''}};

/* ---------- date / FY helpers ---------- */
const pad = n => String(n).padStart(2,'0');
const todayStr = () => {const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const fyOfDate = d => d.getMonth()>=3 ? d.getFullYear() : d.getFullYear()-1;
const fyLabel = fy => `FY ${fy}-${String(fy+1).slice(2)}`;
const qLabel = (fy,q) => `Q${q} FY${String(fy).slice(2)}-${String(fy+1).slice(2)}`;
function fyMonths(fy){return MON.map((m,i)=>{const y=i<9?fy:fy+1;const mm=((i+3)%12)+1;return {key:`${y}-${pad(mm)}`,label:`${m} ${String(y).slice(2)}`,q:Math.floor(i/3)+1,y,mm};});}
function qStart(fy,q){const sm=[4,7,10,1][q-1];return new Date(q===4?fy+1:fy,sm-1,1);}
function nextQ(fy,q){return q===4?{fy:fy+1,q:1}:{fy,q:q+1};}
function qEnd(fy,q){const n=nextQ(fy,q);return new Date(qStart(n.fy,n.q).getTime()-1);}
function monthStart(key){const [y,m]=key.split('-').map(Number);return new Date(y,m-1,1);}
const fmtD = d => d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit'});
const fmtMY = d => ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+String(d.getFullYear()).slice(2);
const asOfDate = () => {const [y,m,d]=S.asOf.split('-').map(Number);return new Date(y,m-1,d,23,59,59);};

/* ---------- number helpers ---------- */
const inr = v => '₹' + Math.round(v||0).toLocaleString('en-IN');
const tn = v => (Math.round((v||0)*1000)/1000).toLocaleString('en-IN',{maximumFractionDigits:3});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isGift = cat => /^gift/i.test(cat||'');

/* ---------- budget engine ---------- */
function tonnes(prod,key){return +(S.lifting[`${prod}_${key}`]?.tonnes||0);}
function releaseMode(key){return S.cfg.releases?.[key]||'normal';}
/* A pot = one product's accrual for one quarter. Usable in the following quarter only. */
function pot(prod,fy,q){
  const months = fyMonths(fy).filter(m=>m.q===q);
  const nq = nextQ(fy,q);
  const useFrom = qStart(nq.fy,nq.q), useTo = qEnd(nq.fy,nq.q);
  const now = asOfDate();
  let t=0, accrued=0, released=0, held=0, early=false;
  months.forEach(m=>{
    const tt=tonnes(prod,m.key), amt=tt*S.cfg.rate, mode=releaseMode(m.key);
    t+=tt; accrued+=amt;
    if(mode==='hold'){held+=amt;return;}
    const from = mode==='early' ? monthStart(m.key) : useFrom;
    if(mode==='early' && amt>0) early=true;
    if(now>=from) released+=amt;
  });
  const expired = S.cfg.lapse && now>useTo;
  const id = `${prod}_${fy}_Q${q}`;
  const acts = S.acts.filter(a=>a.pot===id);
  let planned=0, pending=0, approved=0, spent=0, gift=0;
  acts.forEach(a=>{
    const v=committedAmt(a); if(!v) return;
    if(a.status==='Draft') planned+=v; else if(a.status==='Sent to SAIL') pending+=v; else if(a.status==='Approved by SAIL') approved+=v; else if(a.status==='Completed') spent+=v;
    if(isGift(a.category)) gift+=v;
  });
  const used = planned+pending+approved+spent;
  const giftCap = accrued*S.cfg.giftCapPct/100;
  const balance = expired ? 0 : released-used;
  const lapsed = expired ? Math.max(0, released-used) : 0;
  let status, cls;
  if(now<qStart(fy,q)){status='Not started';cls='c-mute';}
  else if(now<=qEnd(fy,q)){status = early&&released>0 ? 'Accruing · part released' : `Accruing · locked till ${fmtD(useFrom)}`; cls=early&&released>0?'c-info':'c-warn';}
  else if(expired){status='Usage window closed';cls='c-mute';}
  else if(now>=useFrom){status = held>0?'Usable · part on hold':'Usable now'; cls='c-ok';}
  if(held>0 && now>qEnd(fy,q) && !expired && released===0){status='On hold (SAIL)';cls='c-bad';}
  return {id,prod,fy,q,t,accrued,released,held,useFrom,useTo,expired,planned,pending,approved,spent,used,gift,giftCap,balance,lapsed,status,cls,acts};
}
/* Amount an activity takes from its quarter's budget. Only Rejected takes nothing. */
function committedAmt(a){
  if(!a||a.status==='Rejected') return 0;
  const n=v=>(v===null||v===undefined||v==='')?null:+v;
  if(a.status==='Sent to SAIL') return n(a.estAmount)||0;
  if(a.status==='Approved by SAIL') return n(a.approvedAmount)??n(a.estAmount)??0;
  return n(a.actualAmount)??n(a.approvedAmount)??n(a.estAmount)??0;   // Draft / Completed: invoice if entered
}
function potsFor(prod,fy){return [1,2,3,4].map(q=>pot(prod,fy,q));}
function potFromId(id){const [prod,fy,q]=id.split('_');return pot(prod,+fy,+q.slice(1));}

/* ---------- alerts (same rules the email task uses) ---------- */
function waText(team,list){
  const lines=list.filter(x=>x.team===team).map((x,i)=>`${i+1}. ${x.t}`);
  return `*SAIL Branding – ${team} team update (${fmtD(asOfDate())})*\n\n${lines.join('\n')}\n\nTracker: ${location.origin}`;
}
function waButtons(team,list){
  if(S.guest) return '';
  const N={...DEFAULT_NOTIFY,...(S.cfg.notify||{})};
  const nums=(team==='Claims'?N.claimsWa:N.budgetWa)||[];
  if(!list.some(x=>x.team===team)) return '';
  if(!nums.length) return `<span class="hint">${team}: add WhatsApp numbers in Settings to send</span>`;
  const txt=encodeURIComponent(waText(team,list));
  return nums.map(n=>`<a class="btn sm wa" href="https://wa.me/${esc(n.num)}?text=${txt}" target="_blank" rel="noopener">WhatsApp ${team} · ${esc(n.name||n.num)}</a>`).join(' ');
}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
function alerts(){
  const N={...DEFAULT_NOTIFY,...(S.cfg.notify||{})}, now=asOfDate(), out=[];
  const pname=p=>`${PRODS.find(x=>x.k===p.prod).name} ${qLabel(p.fy,p.q)}`;
  const days=n=>n===1?'1 day':n+' days';
  PRODS.forEach(P=>[S.fy-1,S.fy].forEach(fy=>[1,2,3,4].forEach(q=>{
    const p=pot(P.k,fy,q); if(!p.accrued) return;
    const toStart=daysBetween(now,p.useFrom), toEnd=daysBetween(now,p.useTo);
    // 1. use the budget
    if(now<p.useFrom && toStart<=N.warnDays && p.accrued>p.released)
      out.push({kind:'use',team:'Budget',sev:'c-info',t:`${pname(p)} budget of ${inr(p.accrued-p.released)} unlocks on ${fmtD(p.useFrom)} (in ${days(toStart)}). Plan activities and get SAIL approval now.`});
    if(p.released>0 && now<=p.useTo && p.balance>0){
      const urgent=toEnd<=N.warnDays;
      out.push({kind:'use',team:'Budget',sev:urgent?'c-warn':'c-ok',t:`Use ${inr(p.balance)} from ${pname(p)} before ${fmtD(p.useTo)} (${days(toEnd)} left).`});
    }
    if(now>p.useTo && p.balance>0 && daysBetween(p.useTo,now)<=90)
      out.push({kind:'use',team:'Budget',sev:'c-bad',t:`${pname(p)}: spending quarter ended on ${fmtD(p.useTo)} with ${inr(p.balance)} unused.`});
    if(p.balance<0 && !p.expired)
      out.push({kind:'use',team:'Budget',sev:'c-bad',t:`${pname(p)} is over budget by ${inr(-p.balance)}.`});
    // 2. gifting limit
    if(p.giftCap>0 && p.gift>p.giftCap+0.5){
      const gifts=p.acts.filter(a=>isGift(a.category)&&a.status!=='Rejected');
      const missing=gifts.filter(a=>!(a.giftReason||'').trim());
      out.push({kind:'gift',team:'Budget',sev:missing.length?'c-bad':'c-warn',
        t:`${pname(p)}: gifting ${inr(p.gift)} is ${inr(p.gift-p.giftCap)} over the ${S.cfg.giftCapPct}% limit (${inr(p.giftCap)}). `+(missing.length?`Add the reason and SAIL approval for: ${missing.map(a=>'“'+a.title+'”').join(', ')}.`:`Reason recorded${gifts.some(a=>!(a.giftSailRef||'').trim())?'; SAIL approval ref. still missing':''}.`),
        id:(missing[0]||gifts[0])?.id});
    } else if(p.giftCap>0 && p.gift>=0.8*p.giftCap && now<=p.useTo)
      out.push({kind:'gift',team:'Budget',sev:'c-warn',t:`${pname(p)}: gifting at ${inr(p.gift)} — ${Math.round(p.gift/p.giftCap*100)}% of the ${S.cfg.giftCapPct}% limit (${inr(p.giftCap)}).`});
  })));
  S.acts.forEach(a=>{
    if(a.status==='Rejected') return;
    const p=potFromId(a.pot);
    // SAIL approval pending
    if(a.status==='Sent to SAIL' && a.submittedOn){const d=daysBetween(new Date(a.submittedOn),now);if(d>=N.pendingDays)out.push({kind:'sail',team:'Budget',sev:'c-warn',t:`“${a.title}” has been waiting for SAIL approval for ${days(d)}${a.sailRef?' (ref '+a.sailRef+')':''}.`,id:a.id});}
    // 3. claim before the spending quarter ends
    const invoiced = a.status==='Completed' || ((+a.actualAmount||0)>0 && (a.invoiceNo||'').trim());
    if(invoiced && !['Claim submitted to SAIL','Claim received'].includes(a.claimStatus)){
      const toEnd=daysBetween(now,p.useTo);
      const sev = toEnd<0?'c-bad':toEnd<=N.warnDays?'c-bad':'c-warn';
      const when = toEnd<0?`the claim deadline (${fmtD(p.useTo)}) has passed`:`claim before ${fmtD(p.useTo)} (${days(toEnd)} left)`;
      out.push({kind:'claim',team:'Claims',sev,t:`Claim ${inr(a.actualAmount||committedAmt(a))} for “${a.title}”${a.invoiceNo?' (inv. '+a.invoiceNo+')':''} — ${when}. Status: ${a.claimStatus||'Not claimed'}.`,id:a.id});
    }
    if(a.claimStatus==='Claim submitted to SAIL'){const d=a.claimSubmittedOn?daysBetween(new Date(a.claimSubmittedOn),now):null;if(d===null||d>=N.claimDays)out.push({kind:'claim',team:'Claims',sev:'c-warn',t:`Claim for “${a.title}” (${inr(a.actualAmount||committedAmt(a))}) submitted ${d===null?'(date not entered)':days(d)+' ago'} — not yet received.`,id:a.id});}
  });
  const rank={'c-bad':0,'c-warn':1,'c-info':2,'c-ok':3};
  return out.sort((x,y)=>rank[x.sev]-rank[y.sev]);
}
function bellCount(){ return alerts().filter(a=>a.sev==='c-bad'||a.sev==='c-warn').length; }
function updateBell(){ const b=document.getElementById('bell'); if(!b||!S.me) return; const n=bellCount(); b.querySelector('.bn').textContent=n; b.querySelector('.bn').style.display=n?'':'none'; }
function openBell(){
  const al=alerts(), kinds={use:'Use the budget',claim:'Claims to raise',gift:'Gifting limit',sail:'SAIL approvals'};
  const groups=Object.keys(kinds).map(k=>({k,items:al.filter(a=>a.kind===k)})).filter(g=>g.items.length);
  document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" id="mbg"><div class="modal" style="max-width:760px">
    <h2>Notifications <span class="hint" style="font-weight:400">· as of ${fmtD(asOfDate())}</span></h2>

/* ---------- db ---------- */
let toastT;
function toast(msg){clearTimeout(toastT);let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}el.textContent=msg;toastT=setTimeout(()=>el.remove(),2600);}
async function api(path,body){
  const r=await fetch(path,body===undefined?{credentials:'same-origin'}:{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let j={};try{j=await r.json();}catch(_){}
  if(r.status===401&&path!=='/api/auth'){S.me=null;showLogin('Your session ended — please sign in again.');throw new Error('Signed out');}
  if(!r.ok) throw new Error(j.error||('Request failed ('+r.status+')'));
  return j;
}
function handleWriteErr(e){ if(e?.message!=='Signed out') toast(e?.message||'Could not save'); load(); }
async function saveCfg(patch){
  S.cfg={...S.cfg,...patch};
  try{const j=await api('/api/save',{action:'config',config:S.cfg});S.cfg={...DEFAULT_CFG,...j.config};toast('Settings saved');}catch(e){handleWriteErr(e);}
  render();
}
async function load(){
  try{
    const d=await api('/api/data');
    S.me=d.me; S.guest=!d.me; S.readonly=S.guest||!(d.me.role==='admin'||d.me.role==='editor');
    S.cfg={...DEFAULT_CFG,...d.config}; if(!S.cfg.categories?.length)S.cfg.categories=DEFAULT_CATS;
    S.lifting=d.lifting; S.acts=d.activities; S.files=d.files||[]; S.storage=d.storage||{ready:false}; S.err=null;
    S.loaded={cfg:true,lift:true,act:true};
  }catch(e){ if(e.message!=='Signed out') S.err='Could not load data: '+e.message; }
  if(S.me||S.guest){ showApp(); if(!document.getElementById('mbg') && !(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.closest('#main'))) render(); }
}
function showLogin(msg){
  document.getElementById('app').style.display='none';
  const L=document.getElementById('login'); L.style.display='flex';
  document.getElementById('lErr').textContent=msg||'';
}
function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='';
  document.getElementById('who').textContent=S.guest?'View only':`${S.me.name||S.me.email} · ${S.me.role}`;
  document.getElementById('logout').textContent=S.guest?'Sign in to edit':'Sign out';
  document.querySelectorAll('#tabs button[data-t="set"]').forEach(b=>{b.style.display=S.guest?'none':'';b.textContent=S.me?.role==='admin'?'Settings & users':'Settings & rules';});
  if(S.guest&&S.tab==='set'){S.tab='dash';document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='dash'));}
}
async function init(){
  const now=new Date(); S.fy=fyOfDate(now); S.asOf=todayStr();
  setupHeader();
  document.getElementById('lForm').onsubmit=async e=>{
    e.preventDefault();
    const btn=document.getElementById('lBtn');btn.disabled=true;
    try{const j=await api('/api/auth',{action:'login',email:document.getElementById('lEmail').value,password:document.getElementById('lPw').value});S.me=j.user;S.guest=false;document.getElementById('lPw').value='';await load();}
    catch(err){document.getElementById('lErr').textContent=err.message;}
    finally{btn.disabled=false;}
  };
  document.getElementById('logout').onclick=async()=>{
    if(S.guest){showLogin('');return;}
    try{await api('/api/auth',{action:'logout'});}catch(_){}
    S.me=null; if(S.publicView){S.guest=true;await load();} else showLogin('');
  };
  document.getElementById('lView').onclick=async e=>{e.preventDefault();S.guest=true;await load();};
  try{
    const j=await api('/api/auth',{action:'me'});
    S.publicView=!!j.publicView;
    document.getElementById('lViewWrap').style.display=S.publicView?'':'none';
    if(!j.user){
      if(j.setup){showLogin('No accounts yet. Set ADMIN_EMAIL and ADMIN_PASSWORD in Vercel, redeploy, then sign in with them.');return;}
      if(S.publicView){S.guest=true;await load();return;}
      showLogin('');return;
    }
    S.me=j.user; await load();
  }catch(e){showLogin('Could not reach the server: '+e.message);}
  setInterval(()=>{if((S.me||S.guest)&&document.visibilityState==='visible'&&document.getElementById('app').style.display!=='none')load();},30000);
}
function setupHeader(){
  const sel=document.getElementById('fySel');
  const cur=fyOfDate(new Date());
  for(let y=cur+1;y>=2025;y--){const o=document.createElement('option');o.value=y;o.textContent=fyLabel(y);if(y===cur)o.selected=true;sel.appendChild(o);}
  sel.onchange=()=>{S.fy=+sel.value;render();};
  const a=document.getElementById('asOf');a.value=S.asOf;a.onchange=()=>{S.asOf=a.value||todayStr();a.value=S.asOf;render();};

}

function render(){
  const m=document.getElementById('main');
  let pre='';
  if(S.slow) pre+='<div class="banner warn">The data store is taking longer than usual to answer — figures may be incomplete or out of date.</div>';
  if(S.err) pre+=`<div class="banner bad">${esc(S.err)}</div>`;
  if(S.guest) pre+='<div class="banner" style="background:var(--infobg);color:var(--info)">You are viewing the tracker without signing in. Figures are read-only; documents are hidden. Use <b>Sign in to edit</b> (top right) to add or change entries.</div>';
  else if(S.readonly) pre+='<div class="banner warn">View-only access: you can see the figures but not change them. Ask an admin for editor access.</div>';
  if(S.asOf!==todayStr()) pre+=`<div class="banner warn">Showing the budget position as of <b>${fmtD(asOfDate())}</b> (not today). Clear the “As of” date to return to today.</div>`;
  updateBell();
  const body = {dash:renderDash,stmt:renderStmt,lift:renderLift,act:renderActs,terms:renderTerms,set:renderSettings}[S.tab]();
  m.innerHTML=pre+body;
  bind();
}

function prodSummary(p){
  const pots=potsFor(p.k,S.fy);
  // pots usable as of date may include previous FY Q4
  const live=[...potsFor(p.k,S.fy-1),...pots].filter(x=>!x.expired && x.released>0);
  const t=pots.reduce((s,x)=>s+x.t,0), acc=pots.reduce((s,x)=>s+x.accrued,0);
  const avail=live.reduce((s,x)=>s+Math.max(0,x.balance),0);
  const pending=pots.reduce((s,x)=>s+x.planned+x.pending,0)+ (()=>{const z=potsFor(p.k,S.fy-1)[3];return z.planned+z.pending;})();
  const used=pots.reduce((s,x)=>s+x.approved+x.spent,0);
  const locked=pots.reduce((s,x)=>s+Math.max(0,x.accrued-x.released-x.held),0);
  const giftUsed=live.reduce((s,x)=>s+x.gift,0), giftCap=live.reduce((s,x)=>s+x.giftCap,0);
  const lapsed=[...potsFor(p.k,S.fy-1),...pots].reduce((s,x)=>s+x.lapsed,0);
  return {pots,t,acc,avail,pending,used,locked,giftUsed,giftCap,lapsed,live};
}

    return `<div class="card"><h2><span class="dot" style="background:${p.color}"></span>${p.name} <span class="hint" style="font-weight:400">· ${fyLabel(S.fy)}</span></h2>
      <div class="kpis">

      <td class="n">${x.accrued?`<span style="color:${x.gift>x.giftCap?'var(--bad)':'inherit'}">${inr(x.gift)}</span> <span class="hint">/ ${inr(x.giftCap)}</span>`:'—'}</td>
    </tr>`).join('');
    const T=k=>pots.reduce((s,x)=>s+x[k],0);
    return `<div class="card"><h2><span class="dot" style="background:${p.color}"></span>${p.name} — quarter-wise budget</h2><div class="tw"><table>
      <thead><tr><th>Lifting quarter</th><th class="n">Tonnes</th><th class="n">Accrued</th><th>Use window</th><th>Status</th><th class="n">Released</th><th class="n">Draft / pending SAIL</th><th class="n">Approved / spent</th><th class="n">Balance</th><th class="n">Gifting / cap</th></tr></thead>
      <tbody>${rows}<tr class="tot"><td>Total</td><td class="n">${tn(T('t'))}</td><td class="n">${inr(T('accrued'))}</td><td></td><td></td><td class="n">${inr(T('released'))}</td><td class="n">${inr(T('planned')+T('pending'))}</td><td class="n">${inr(T('approved')+T('spent'))}</td><td class="n">${inr(T('balance'))}</td><td></td></tr></tbody></table></div></div>`;
  }).join('');

  const upcoming = S.acts.filter(a=>a.status==='Sent to SAIL').sort((a,b)=>(a.submittedOn||'').localeCompare(b.submittedOn||''));

  const al=alerts();
  const alHtml=`<div class="card" style="margin-bottom:14px"><h2>Alerts <span class="hint" style="font-weight:400">· use the budget, claims, gifting limit, SAIL approvals</span></h2>${al.length?`<table><tbody>${al.map(x=>`<tr><td style="width:90px"><span class="chip ${x.team==='Claims'?'c-info':'c-mute'}">${x.team} team</span></td><td><span class="chip ${x.sev}" style="margin-right:6px">●</span>${esc(x.t)}</td><td style="width:70px">${x.id?`<button class="btn sec sm" data-edit="${x.id}">Open</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty" style="padding:12px">No alerts right now.</div>'}${al.length?`<div class="toolbar" style="margin:12px 0 0;flex-wrap:wrap">${waButtons('Budget',al)} ${waButtons('Claims',al)}</div>`:''}</div>`;
  return alHtml+`<div class="grid g2">${cards}</div>

function chart(){
  const ms=fyMonths(S.fy);
  const vals=ms.map(m=>[tonnes('HR',m.key),tonnes('STR',m.key)]);
  const max=Math.max(1,...vals.flat());
  const W=1000,H=240,pl=50,pb=34,pt=10,cw=(W-pl-10)/12,bw=cw*0.32;
  const nice=(()=>{const p=Math.pow(10,Math.floor(Math.log10(max)));const s=[1,2,2.5,5,10].map(x=>x*p).find(x=>x*4>=max)||p*10;return s;})();
  const top=nice*4, y=v=>pt+(H-pt-pb)*(1-v/top);
  let g='';
  for(let i=0;i<=4;i++){const v=nice*i;g+=`<line x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#e6e9ef"/><text x="${pl-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#5b6475">${v.toLocaleString('en-IN')}</text>`;}
  ms.forEach((m,i)=>{const x=pl+cw*i+cw/2;
    [[vals[i][0],'#01578C',-bw-1],[vals[i][1],'#C7701E',1]].forEach(([v,c,o])=>{if(v>0)g+=`<rect x="${x+o}" y="${y(v)}" width="${bw}" height="${H-pb-y(v)}" rx="2" fill="${c}"><title>${m.label}: ${tn(v)} t</title></rect>`;});
    g+=`<text x="${x}" y="${H-pb+16}" font-size="11.5" text-anchor="middle" fill="#5b6475">${m.label}</text>`;
    if(i%3===0&&i>0)g+=`<line x1="${pl+cw*i}" x2="${pl+cw*i}" y1="${pt}" y2="${H-pb}" stroke="#c9cfd9" stroke-dasharray="3 3"/>`;
  });
  return `<div class="legend" style="margin-bottom:6px"><span><i class="dot" style="background:#01578C"></i>HR Coil (t)</span><span><i class="dot" style="background:#C7701E"></i>Structural (t)</span><span>Dashed lines = quarter ends</span></div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly tonnes lifted">${g}</svg>`;
}

/* ---------- terms & conditions ---------- */
const DEFAULT_TERMS = `SAIL Branding Support — Terms & Conditions (Bharat Steel (Chennai) Pvt. Ltd.)

1. Earning the budget
Branding support is earned at ₹{rate} per tonne of HR Coil and Structural lifted from SAIL. HR Coil and Structural budgets are earned and tracked separately.

2. When the budget can be used
The budget builds up month by month during a quarter. It can be used only after that quarter ends, in the following quarter (Apr–Jun lifting is spent in Jul–Sep, Jul–Sep in Oct–Dec, Oct–Dec in Jan–Mar, Jan–Mar in Apr–Jun of the next year). It must not be used before it has been earned.

3. Exceptions
SAIL may allow exceptions in writing. April 2026 lifting was approved for early use because of finance issues; from then on the quarterly process applies.

4. SAIL approval
Every branding activity needs SAIL's approval before it is carried out. Keep the SAIL approval reference and letter with the activity.

5. Gifting items
Gifting items (T-shirts, stationery and similar) may use at most {gift}% of a quarter's budget. Anything above that needs a written reason and SAIL's approval for the excess.

6. Claims
Claims are made on the invoice amount without GST, with the invoice and proof of the branding attached. Raise each claim before the end of the quarter in which that budget is used.

7. Records
Invoices, creatives, SAIL approvals and credit notes are kept against each activity in this tracker.`;

/* ---------- quarter statement (sheet format) ---------- */
function renderStmt(){
  if(!S.loaded.lift) return '<div class="empty">Loading…</div>';
  const fmt2=v=>(+v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const blocks=[];
  PRODS.forEach(P=>{[1,2,3,4].forEach(q=>{
    const p=pot(P.k,S.fy,q);
    const months=fyMonths(S.fy).filter(m=>m.q===q);
    const ex=S.acts.filter(a=>a.pot===p.id).sort((a,b)=>(a.invoiceDate||a.plannedOn||'').localeCompare(b.invoiceDate||b.plannedOn||''));
    if(!p.accrued && !ex.length) return;
    const spent=ex.reduce((s,a)=>s+committedAmt(a),0);
    const n=Math.max(months.length,ex.length);
    let rows='';
    for(let i=0;i<n;i++){
      const m=months[i], a=ex[i];
      const t=m?tonnes(P.k,m.key):null;
      const dim=a&&a.status==='Rejected';
      const d=a?(a.invoiceDate||a.plannedOn):'';
      rows+=`<tr${dim?' class="dim"':''}>
        <td>${m?MON[(q-1)*3+i]:''}</td><td class="n">${m?(t?fmt2(t):''):''}</td><td class="n">${m?(t?fmt2(t*S.cfg.rate):''):''}</td>
        <td>${a&&d?fmtD(new Date(d)):''}</td>
        <td>${a?`<a href="#" data-edit="${a.id}">${esc(a.title)}</a>${isGift(a.category)?' <span class="chip c-info">Gifting</span>':''}${clip('activity',a.id)}`:''}</td>
        <td>${a?esc(a.invoiceNo||''):''}</td>
        <td class="n">${a?fmt2(committedAmt(a)).replace(/\.00$/,''):''}</td>
        <td>${a?`${esc(a.claimStatus&&a.claimStatus!=='Not claimed'?a.claimStatus:'')}${a.cnNo||a.cnAmount?`<div class="hint">CN ${esc(a.cnNo||'')}${a.cnAmount?' · '+inr(a.cnAmount):''}</div>`:''}<div class="hint">${a.status}</div>`:''}</td></tr>`;
    }
    const diff=p.accrued-spent, nq=nextQ(S.fy,q);
    blocks.push(`<div class="card stmt" style="margin-bottom:14px"><div class="tw"><table>
      <thead><tr class="yh"><th colspan="8">${P.name==='HR Coil'?'HR':'Structural'} (${MON[(q-1)*3]} - ${MON[(q-1)*3+2]} Lifting) <span style="font-weight:500">→ spend in ${MON[(nq.q-1)*3]} - ${MON[(nq.q-1)*3+2]}</span> &nbsp;<span class="chip ${p.cls}" style="font-size:11px">${p.status}</span></th></tr>
      <tr class="yc"><th>Month</th><th class="n">Lifting (t)</th><th class="n">Lifting Budget</th><th>Invoice Date</th><th>Type of Expense</th><th>Invoice Number</th><th class="n">Amount without GST</th><th>Claim Status</th></tr></thead>
      <tbody>${rows}
      <tr class="tot"><td>Total Spent</td><td class="n">${fmt2(p.t)}</td><td></td><td></td><td></td><td></td><td class="n">${fmt2(spent).replace(/\.00$/,'')}</td><td></td></tr>
      <tr class="tot"><td>Lifting Budget</td><td></td><td class="n">${fmt2(p.accrued)}</td><td></td><td class="hint" style="font-weight:400">Gifting ${inr(p.gift)} of ${inr(p.giftCap)} cap (${S.cfg.giftCapPct}%)</td><td></td><td class="n">${fmt2(p.accrued).replace(/\.00$/,'')}</td><td></td></tr>
      <tr class="tot"><td>${diff<0?'Excess Amount':'Remaining Amount'}</td><td></td><td></td><td></td><td></td><td></td><td class="n ${diff<0?'xs':'rm'}">${fmt2(diff).replace(/\.00$/,'')}</td><td></td></tr>
      </tbody></table></div></div>`);
  });});
  const curQ=(()=>{const m=asOfDate().getMonth()+1;return m>=4?Math.floor((m-4)/3)+1:4;})();
  const dlBar=`<div class="card toolbar" style="margin-bottom:14px"><b>Download report</b><select id="dlQ" style="width:auto;border:1px solid #cdd3dd;border-radius:6px;padding:6px 8px">${[1,2,3,4].map(q=>`<option value="${q}" ${q===(curQ===1?4:curQ-1)?'selected':''}>Q${q} lifting (${MON[(q-1)*3]}–${MON[(q-1)*3+2]}) · ${fyLabel(S.fy)}</option>`).join('')}<option value="all">All quarters · ${fyLabel(S.fy)}</option></select><button class="btn" id="dlBtn">Download Excel</button><span class="hint">HR Coil and Structural blocks in your sheet format, plus a summary tab</span></div>`;
  return dlBar+`<div class="toolbar"><span class="hint">Each block is one quarter's lifting and the expenses charged to it. Totals deduct every activity except Rejected ones (shown greyed), including Drafts. Click an expense to open it; 📎 shows attached documents.</span><span class="sp"></span>${S.guest?'':`<button class="btn" id="newAct" ${S.readonly?'disabled':''}>+ New activity</button>`}</div>`+
    (blocks.length?blocks.join(''):'<div class="card empty">No lifting or expenses entered for this year yet. Start on the Lifting entry tab.</div>');
}

let excelLib=null;
function loadExcel(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(excelLib) return excelLib;
  excelLib=new Promise((res,rej)=>{const s=document.createElement('script');s.src='/exceljs.min.js';s.onload=()=>res(window.ExcelJS);s.onerror=()=>{excelLib=null;rej(new Error('Could not load the Excel library'));};document.head.appendChild(s);});
  return excelLib;
}
function addBlock(ws,r,P,fy,q){
  const p=pot(P.k,fy,q), months=fyMonths(fy).filter(m=>m.q===q), nq=nextQ(fy,q);
  const ex=S.acts.filter(a=>a.pot===p.id).sort((a,b)=>(a.invoiceDate||a.plannedOn||'').localeCompare(b.invoiceDate||b.plannedOn||''));
  const spent=ex.reduce((s,a)=>s+committedAmt(a),0);
  const YEL={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF00'}};
  const thin={style:'thin',color:{argb:'FF000000'}}, B={top:thin,left:thin,bottom:thin,right:thin};
  const box=(row)=>{for(let c=1;c<=8;c++){ws.getCell(row,c).border=B;}};
  ws.mergeCells(r,1,r,8);
  const t=ws.getCell(r,1);
  t.value=`${P.k==='HR'?'HR':'Structural'} (${MON[(q-1)*3]} - ${MON[(q-1)*3+2]} Lifting) — spend in ${MON[(nq.q-1)*3]} - ${MON[(nq.q-1)*3+2]}  [${qLabel(fy,q)}]`;
  t.font={bold:true,size:13};t.alignment={horizontal:'center'};t.fill=YEL;box(r);r++;
  ['Month','Lifting (t)','Lifting Budget','Invoice Date','Type of Expense','Invoice Number','Amount without GST','Claim Status'].forEach((hd,i)=>{const c=ws.getCell(r,i+1);c.value=hd;c.font={bold:true,size:12};c.fill=YEL;});
  box(r);r++;
  const n=Math.max(months.length,ex.length);
  for(let i=0;i<n;i++){
    const m=months[i],a=ex[i],row=ws.getRow(r);
    if(m){const tt=tonnes(P.k,m.key);row.getCell(1).value=MON[(q-1)*3+i];if(tt){row.getCell(2).value=tt;row.getCell(3).value=Math.round(tt*S.cfg.rate*100)/100;}}
    if(a){
      const d=a.invoiceDate||a.plannedOn; if(d){const [y,mm,dd]=d.split('-').map(Number);row.getCell(4).value=new Date(Date.UTC(y,mm-1,dd));row.getCell(4).numFmt='dd-mmm-yy';}
      row.getCell(5).value=a.title+(isGift(a.category)?' (Gifting)':'');
      row.getCell(6).value=a.invoiceNo||'';
      row.getCell(7).value=committedAmt(a);
      row.getCell(8).value=[a.claimStatus&&a.claimStatus!=='Not claimed'?a.claimStatus:'',a.status,a.cnNo||a.cnAmount?`CN ${a.cnNo||''}${a.cnAmount?' '+Math.round(a.cnAmount).toLocaleString('en-IN'):''}`.trim():''].filter(Boolean).join(' / ');
      if(a.status==='Rejected') for(let c=4;c<=8;c++) row.getCell(c).font={color:{argb:'FF8A8A8A'},italic:true};
    }
    row.getCell(2).numFmt='#,##0.00';row.getCell(3).numFmt=INR2;row.getCell(7).numFmt=INR0;
    box(r);r++;
  }
  const tot=(label,col,val,extra)=>{const row=ws.getRow(r);row.getCell(1).value=label;row.getCell(1).font={bold:true};
    if(extra)extra(row); if(col){row.getCell(col).value=val;row.getCell(col).numFmt=val<0?'-#,##0.00;-#,##0.00':INR2;row.getCell(col).font={bold:true};}box(r);r++;return row;};
  tot('Total Spent',7,spent,row=>{row.getCell(2).value=p.t;row.getCell(2).numFmt='#,##0.00';row.getCell(2).font={bold:true};});
  tot('Lifting Budget',7,p.accrued,row=>{row.getCell(3).value=p.accrued;row.getCell(3).numFmt=INR2;row.getCell(3).font={bold:true};
    row.getCell(5).value=`Gifting: ${Math.round(p.gift).toLocaleString('en-IN')} of ${Math.round(p.giftCap).toLocaleString('en-IN')} cap (${S.cfg.giftCapPct}%)`;row.getCell(5).font={italic:true,color:{argb:'FF555555'}};});
  const diff=p.accrued-spent;
  const xr=tot(diff<0?'Excess Amount':'Excess/ Remaining Amount',7,diff);
  if(diff<0){xr.getCell(7).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFC00000'}};xr.getCell(7).font={bold:true,color:{argb:'FFFFFFFF'}};}
  return r+1;
}
const INR2='[>=10000000]##\\,##\\,##\\,##0.00;[>=100000]##\\,##\\,##0.00;##,##0.00', INR0='[>=10000000]##\\,##\\,##\\,##0;[>=100000]##\\,##\\,##0;##,##0';
function setCols(ws){[24,13,16,14,34,22,22,26].forEach((w,i)=>ws.getColumn(i+1).width=w);ws.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0};ws.views=[{showGridLines:false}];}
function summarySheet(wb,fy,qs){
  const ws=wb.addWorksheet('Summary');setCols(ws);
  const YEL={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFFF00'}};
  ws.mergeCells(1,1,1,8);const t=ws.getCell(1,1);t.value=`SAIL Branding Budget — ${fyLabel(fy)} — Bharat Steel (Chennai) Pvt. Ltd.`;t.font={bold:true,size:14};t.alignment={horizontal:'center'};t.fill=YEL;
  ws.getCell(2,1).value=`Rate ₹${S.cfg.rate}/tonne · Gifting cap ${S.cfg.giftCapPct}% · Generated ${fmtD(new Date())}`;ws.getCell(2,1).font={italic:true,color:{argb:'FF555555'}};
  const hd=['Product','Lifting quarter','Tonnes','Budget accrued','Use window','Draft / pending SAIL','Approved / spent','Balance / Excess'];
  hd.forEach((x,i)=>{const c=ws.getCell(4,i+1);c.value=x;c.font={bold:true};c.fill=YEL;c.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};});
  let r=5;
  PRODS.forEach(P=>qs.forEach(q=>{const p=pot(P.k,fy,q);
    const vals=[P.name,qLabel(fy,q),p.t,p.accrued,`${fmtMY(p.useFrom)} – ${fmtMY(p.useTo)}`,p.planned+p.pending,p.approved+p.spent,p.released?p.balance:p.accrued-p.used];
    vals.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;c.border={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};if(i===2)c.numFmt='#,##0.000';if(i>=3&&i!==4)c.numFmt=(typeof v==='number'&&v<0)?'-#,##0;-#,##0':INR0;});
    if(vals[7]<0){const c=ws.getCell(r,8);c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFC00000'}};c.font={bold:true,color:{argb:'FFFFFFFF'}};}
    r++;}));
}
async function buildReport(ExcelJS,fy,which){
  const wb=new ExcelJS.Workbook();wb.creator='SAIL Branding Budget Tracker';
  const qs=which==='all'?[1,2,3,4]:[+which];
  summarySheet(wb,fy,qs);
  qs.forEach(q=>{const ws=wb.addWorksheet(`Q${q} ${MON[(q-1)*3]}-${MON[(q-1)*3+2]} Lifting`);setCols(ws);let r=1;PRODS.forEach(P=>{r=addBlock(ws,r,P,fy,q);});});
  return wb.xlsx.writeBuffer();
}
async function downloadReport(){
  const which=document.getElementById('dlQ').value, btn=document.getElementById('dlBtn');
  btn.disabled=true;btn.textContent='Preparing…';
  try{
    const ExcelJS=await loadExcel();
    const buf=await buildReport(ExcelJS,S.fy,which);
    const fyTag=`FY${String(S.fy).slice(2)}-${String(S.fy+1).slice(2)}`;
    const url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a=document.createElement('a');a.href=url;a.download=`SAIL_Branding_${which==='all'?'All_Quarters':'Q'+which}_${fyTag}.xlsx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  }catch(e){ toast('Download failed: '+(e?.message||e)); }
  finally{btn.disabled=false;btn.textContent='Download Excel';}
}

function filesFor(kind,ref){return (S.files||[]).filter(f=>f.kind===kind&&f.ref===ref);}
function clip(kind,ref){const n=filesFor(kind,ref).length;return n?` <span class="hint" title="${n} document${n>1?'s':''}">📎${n}</span>`:'';}
const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function docsList(kind,ref){
  const list=filesFor(kind,ref);
  if(!list.length) return '<div class="hint" style="margin:4px 0 8px">No documents yet.</div>';
  return `<table style="margin-bottom:8px"><tbody>${list.map(f=>`<tr><td style="width:150px"><span class="chip c-mute">${esc(f.doc_type)}</span></td>
    <td><a href="/api/files?id=${f.id}" target="_blank" rel="noopener">${esc(f.name)}</a><div class="hint">${fmtSize(f.size)} · ${esc(f.uploaded_by||'')} · ${f.created?fmtD(new Date(f.created)):''}</div></td>
    <td style="width:90px;text-align:right">${S.readonly?'':`<button class="btn danger sm" data-fdel="${f.id}">Delete</button>`}</td></tr>`).join('')}</tbody></table>`;
}
function docsPanel(kind,ref,types){
  if(S.guest){const n=filesFor(kind,ref).length;return `<div class="hint">${n?n+' document'+(n>1?'s':'')+' attached. ':'No documents attached. '}Sign in to view documents.</div>`;}
  const up = S.readonly ? '' : (!S.storage?.ready
    ? '<div class="banner warn" style="margin:0">File storage is not connected yet — an admin needs to connect a Vercel Blob store (Private) to the project and redeploy.</div>'
    : `<div class="toolbar" style="margin:0"><select class="dType" style="width:auto;border:1px solid #cdd3dd;border-radius:6px;padding:6px 8px">${types.map(t=>`<option>${t}</option>`).join('')}</select>
       <input type="file" class="dFile" multiple style="max-width:280px"><button class="btn sm dUp">Upload</button><span class="hint dMsg"></span></div>
       <div class="hint">PDF, images, Word/Excel, CorelDraw/AI/PSD or ZIP — up to 100 MB each.</div>`);
  return `<div class="docs" data-kind="${kind}" data-ref="${esc(ref)}"><div class="dList">${docsList(kind,ref)}</div>${up}</div>`;
}
let _blobMod=null;
async function blobUpload(){ if(!_blobMod){ _blobMod=await import('/blob-client.js'); } return S.storage?.mode==='presigned'?_blobMod.uploadPresigned:_blobMod.upload; }
async function refreshFiles(){ try{const d=await api('/api/data'); S.files=d.files; S.storage=d.storage;}catch(_){ } }
function bindDocs(root){
  root.querySelectorAll('.docs').forEach(box=>{
    const kind=box.dataset.kind, ref=box.dataset.ref, q=s=>box.querySelector(s);
    const redraw=()=>{ q('.dList').innerHTML=docsList(kind,ref); bindDel(); };
    const bindDel=()=>box.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=async()=>{
      if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Sure?';return;}
      b.disabled=true;try{await api('/api/files',{action:'delete',id:+b.dataset.fdel});S.files=S.files.filter(f=>f.id!==+b.dataset.fdel);redraw();toast('Document deleted');}catch(e){toast(e.message);b.disabled=false;}
    });
    bindDel();
    if(!q('.dUp')) return;
    q('.dUp').onclick=async()=>{
      const files=[...q('.dFile').files], type=q('.dType').value, msg=q('.dMsg'), btn=q('.dUp');
      if(!files.length){toast('Choose a file first');return;}
      const big=files.find(f=>f.size>100*1024*1024); if(big){toast(big.name+' is over 100 MB');return;}
      btn.disabled=true;
      try{
        const upload=await blobUpload();
        for(let i=0;i<files.length;i++){
          const f=files[i], safe=(f.name.replace(/[^A-Za-z0-9._-]+/g,'_').replace(/^_+/,'')||'file').slice(-120);
          msg.textContent=`Uploading ${i+1}/${files.length}: ${f.name}…`;
          const blob=await upload(`sail/${kind}/${ref}/${safe}`, f, {access:S.storage.access, handleUploadUrl:'/api/upload', multipart:f.size>8*1024*1024,
            onUploadProgress:e=>{msg.textContent=`Uploading ${i+1}/${files.length}: ${f.name} — ${Math.round(e.percentage)}%`;}});
          await api('/api/files',{action:'register',kind,ref,docType:type,name:f.name,size:f.size,type:f.type,url:blob.url,pathname:blob.pathname});
        }
        msg.textContent=''; q('.dFile').value='';
        await refreshFiles(); redraw(); toast(files.length>1?`${files.length} documents uploaded`:'Document uploaded');
      }catch(e){ msg.textContent=''; toast('Upload failed: '+(e.message||e)); }
      finally{ btn.disabled=false; }
    };
  });
}
function openDocs(kind,ref,label){
  const types=kind==='lifting'?['SAIL invoice','Credit note','Other']:['Invoice','Creative / artwork','SAIL approval','Credit note','Photo / proof','Other'];

}

function potOptions(prod, current){
  const fys=[S.fy-1,S.fy,S.fy+1];
  const all=fys.flatMap(fy=>[1,2,3,4].map(q=>pot(prod,fy,q))).filter(p=>p.accrued>0||p.id===current);
  if(!all.length) return '<option value="">No lifting entered yet for this product</option>';
  return all.map(p=>`<option value="${p.id}" ${p.id===current?'selected':''}>${qLabel(p.fy,p.q)} lifting — balance ${inr(p.balance)}${p.expired?' (closed)':p.released<p.accrued?' (locked/partly locked)':''}</option>`).join('');
}
function defaultPot(prod){
  const fys=[S.fy-1,S.fy];
  const c=fys.flatMap(fy=>[1,2,3,4].map(q=>pot(prod,fy,q))).filter(p=>p.balance>0);
  if(c.length) return c[0].id;
  const any=fys.flatMap(fy=>[1,2,3,4].map(q=>pot(prod,fy,q))).filter(p=>p.accrued>0&&!p.expired);
  return any[0]?.id||'';
}

function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function validate(n,id){
  const e=[], w=[];
  if(!n.title) e.push('Enter an activity title.');
  if(!n.pot) e.push('Choose which quarter’s budget this is charged to (enter lifting tonnes first if none are listed).');
  if(!(n.estAmount>0)) e.push('Enter the estimated amount.');
  if(e.length) return {errs:e,warns:w};
  if(n.status==='Approved by SAIL'&&!n.approvedOn) e.push('Enter the date SAIL approved it.');
  if(n.status==='Completed'&&!n.approvedOn) e.push('An activity can be completed only after SAIL approval — enter the SAIL approval date.');
  if(n.status==='Completed'&&!(n.actualAmount>0)) e.push('Enter the invoice amount (without GST) for a completed activity.');
  // budget checks, excluding this activity's own existing claim
  const p=potFromId(n.pot);
  const old=id?S.acts.find(x=>x.id===id):null;
  const oldAmt = old&&old.pot===n.pot?committedAmt(old):0;
  const oldGift = old&&old.pot===n.pot&&isGift(old.category)?oldAmt:0;
  const amt=committedAmt(n);
  if(isGift(n.category) && n.status!=='Rejected'){
    const g=p.gift-oldGift+amt;
    if(g>p.giftCap+0.5){
      if(!(n.giftReason||'').trim()) e.push(`Gifting for this quarter would reach ${inr(g)}, above the ${S.cfg.giftCapPct}% limit of ${inr(p.giftCap)} by ${inr(g-p.giftCap)}. Fill in “Reason for exceeding the gifting limit” to continue.`);
      else if(!(n.giftSailRef||'').trim()) w.push(`Gifting goes ${inr(g-p.giftCap)} over the ${S.cfg.giftCapPct}% limit. Add the SAIL approval reference for the excess when you have it.`);
    } else if(g>=0.8*p.giftCap) w.push(`Gifting for this quarter will be ${inr(g)} — ${Math.round(g/p.giftCap*100)}% of the ${S.cfg.giftCapPct}% limit (${inr(p.giftCap)}).`);
  }
  if(n.status==='Draft'||n.status==='Rejected') return {errs:e,warns:w};
  if(p.expired) w.push(`The ${qLabel(p.fy,p.q)} budget could only be used until ${fmtD(p.useTo)} — that window has closed.`);
  const avail=p.balance+oldAmt;
  const pname=`${qLabel(p.fy,p.q)} ${PRODS.find(x=>x.k===p.prod).name}`;
  if(p.released<=0 && !p.expired){
    e.push(`The ${pname} budget is not released yet — it can be used only from ${fmtD(p.useFrom)}${p.held?' (on hold by SAIL)':''}. Keep this activity as Draft until then.`);
  } else if(amt>avail+0.5){
    w.push(`This goes ${inr(amt-avail)} over the ${pname} balance of ${inr(Math.max(0,avail))} — it will show as Excess.`+(p.released<p.accrued?` (${inr(p.accrued-p.released)} more is released from ${fmtD(p.useFrom)}.)`:''));
  }
  if(n.plannedOn && !p.expired && S.cfg.lapse && new Date(n.plannedOn)>p.useTo) w.push(`Planned date is after ${fmtD(p.useTo)}, when this budget lapses.`);
  return {errs:e,warns:w};
}

  if(g('saveSet')) g('saveSet').onclick=()=>{
    const cats=g('sCats').value.split('\n').map(s=>s.trim()).filter(Boolean);
    saveCfg({rate:Math.max(0,+g('sRate').value||0),giftCapPct:Math.min(100,Math.max(0,+g('sGift').value||0)),lapse:g('sLapse').checked,publicView:g('sPublic').checked,categories:cats.length?cats:DEFAULT_CATS});
  };
}
init();
</script>
</body>
